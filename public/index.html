<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Água Justa ⚖️💧</title>

<!-- Estilo -->
<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
.container{
  background:#1e293b;
  padding:20px;
  margin:20px auto;
  width:320px;
  border-radius:10px;
}
input, select, button{
  width:90%;
  margin:5px;
  padding:10px;
  border-radius:5px;
  border:none;
}
button{
  background:#22c55e;
  color:white;
  cursor:pointer;
}
button:hover{
  background:#16a34a;
}
#res{
  margin-top:10px;
  background:#020617;
  padding:10px;
  border-radius:5px;
}
</style>

<!-- Bibliotecas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<h1>⚖️ Água Justa 💧</h1>

<div class="container">
<h3>🔐 Login</h3>
<input id="email" placeholder="Email">
<input id="senha" type="password" placeholder="Senha">
<button onclick="login()">Entrar</button>
<button onclick="register()">Registrar</button>
</div>

<div class="container">
<h3>📊 Simulador Inteligente</h3>

<input id="cliente" placeholder="Nome do Cliente">
<input id="consumo" placeholder="Consumo m³">

<select id="tipo">
  <option value="normal">Residencial</option>
  <option value="social">Tarifa Social</option>
  <option value="vulneravel">Vulnerável</option>
  <option value="industrial">Industrial</option>
</select>

<select id="contestacao">
  <option value="nao">Sem contestação</option>
  <option value="sim">Contestar cobrança</option>
</select>

<button onclick="gerarAnalise()">🔍 Analisar</button>
<button onclick="gerarPDF()">📄 Gerar PDF</button>

<div id="res"></div>
<div id="qr"></div>
</div>

<script>

// 🔐 LOGIN
async function login(){
  alert("Login simulado ✔️");
}

async function register(){
  alert("Registro simulado ✔️");
}

// 🧠 DETECÇÃO DE IRREGULARIDADE
function detectarIrregularidade(consumo){
  if(consumo > 50) return "🔴 Consumo muito alto (possível vazamento)";
  if(consumo === 0) return "🟡 Possível erro de leitura";
  return "🟢 Consumo normal";
}

// 📊 ANÁLISE
function gerarAnalise(){
  const cliente = document.getElementById('cliente').value;
  const consumo = parseFloat(document.getElementById('consumo').value)||0;
  const tipo = document.getElementById('tipo').value;

  let base = consumo <=10 ? 3 : consumo<=20 ? 5 : consumo<=30 ? 7 : 10;

  if(tipo==='social') base*=0.6;
  if(tipo==='vulneravel') base*=0.4;
  if(tipo==='industrial') base*=1.5;

  const agua = consumo*base;
  const esgoto = agua;
  const total = agua+esgoto;

  const analise = detectarIrregularidade(consumo);

  document.getElementById('res').innerHTML=
  `<b>Cliente:</b> ${cliente}<br>
  <b>Total:</b> R$ ${total.toFixed(2)}<br>
  <b>Análise:</b> ${analise}`;
}

// 📄 PDF
function gerarPDF(){
  const cliente = document.getElementById('cliente').value || "---";
  const consumo = parseFloat(document.getElementById('consumo').value)||0;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("Água Justa - Relatório", 20, 20);
  doc.text(`Cliente: ${cliente}`, 20, 40);
  doc.text(`Consumo: ${consumo} m³`, 20, 50);

  doc.save("relatorio.pdf");
}

</script>

</body>
</html>
