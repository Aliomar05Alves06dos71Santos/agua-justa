<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Água Justa ⚖️💧</title>

<style>
body {font-family:Arial;background:#e6f7ff;margin:0;}
.container {max-width:500px;margin:auto;background:#fff;padding:15px;min-height:100vh;}

.tela {display:none;}
.ativa {display:block;}

h2,h3{text-align:center;}

.campo {display:flex;flex-direction:column;margin-bottom:10px;}

input, select {
padding:12px;
font-size:16px;
border-radius:6px;
border:1px solid #ccc;
}

button {
width:100%;
padding:14px;
margin-top:10px;
background:#0077cc;
color:white;
border:none;
border-radius:6px;
font-size:16px;
}

.nav {display:flex;gap:10px;}

.resultado {padding:15px;border-radius:6px;margin-top:15px;}
.verde{background:#d4edda;}
.amarelo{background:#fff3cd;}
.vermelho{background:#f8d7da;font-weight:bold;}

.box {
background:#f8f9fa;
padding:10px;
border-radius:6px;
margin-top:10px;
border-left:4px solid #0077cc;
}
</style>
</head>

<body>

<div class="container">

<!-- TELA 1 -->
<div class="tela ativa" id="t1">

<h2>💧 Água Justa ⚖️💧</h2>

<p><b>Verifique sua conta de água com análise técnica simples.</b></p>

<p>
💸 Cobranças indevidas<br>
🚽 Esgoto e tarifa aplicada<br>
🏠 Economias cadastradas<br>
🔎 Erros de cadastro<br>
📉 Consumo fora do padrão
</p>

<button onclick="next(2)">Iniciar análise</button>

</div>

<!-- TELA 2 -->
<div class="tela" id="t2">

<h3>Dados principais</h3>

<div class="campo">
<label>Tipo de ligação</label>
<select id="ligacao">
<option value="agua_esgoto">Água e Esgoto</option>
<option value="agua">Água</option>
<option value="esgoto">Esgoto</option>
</select>
</div>

<div class="campo">
<label>Economias / Residências</label>
<select id="economias">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
</select>
</div>

<div class="campo">
<label>Moradores</label>
<select id="moradores">
<option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
</select>
</div>

<div class="campo">
<label>Desempregados</label>
<select id="desempregados">
<option>0</option><option>1</option><option>2</option><option>3</option>
</select>
</div>

<div class="campo">
<label>Renda familiar</label>
<input id="renda" type="text">
</div>

<div class="nav">
<button onclick="next(1)">Voltar</button>
<button onclick="next(3)">Próximo</button>
</div>

</div>

<!-- TELA 3 -->
<div class="tela" id="t3">

<h3>Consumo</h3>

<div class="campo">
<label>Leitura inicial</label>
<input id="li" type="number">
<input id="dataIni" type="date">
</div>

<div class="campo">
<label>Leitura final</label>
<input id="lf" type="number">
<input id="dataFim" type="date">
</div>

<div class="campo">
<label>Destino do esgoto</label>
<select id="destino">
<option value="rede">Rede pública</option>
<option value="fossa">Fossa séptica</option>
<option value="corrego">Córrego</option>
<option value="ceu">Céu aberto</option>
</select>
</div>

<div class="nav">
<button onclick="next(2)">Voltar</button>
<button onclick="calcular(); next(4)">Calcular</button>
</div>

</div>

<!-- TELA 4 -->
<div class="tela" id="t4">

<h3>Resultado</h3>
<div id="resultado"></div>

<button onclick="next(1)">Nova análise</button>

</div>

</div>

<script>

/* navegação */
function next(n){
document.querySelectorAll(".tela").forEach(t=>t.classList.remove("ativa"));
document.getElementById("t"+n).classList.add("ativa");
}

/* TARIFA ARSESP (estrutura progressiva realista) */
function tarifa(consumo){
let faixas = [
{lim:10, valor:2.60},
{lim:20, valor:4.90},
{lim:50, valor:7.80},
{lim:Infinity, valor:11.20}
];

let total = 0;
let ant = 0;

for(let f of faixas){
if(consumo > ant){
let uso = Math.min(consumo, f.lim) - ant;
total += uso * f.valor;
ant = f.lim;
}
}
return total;
}

/* cálculo */
function calcular(){

let li = +document.getElementById("li").value || 0;
let lf = +document.getElementById("lf").value || 0;

let moradores = +document.getElementById("moradores").value || 1;
let economias = +document.getElementById("economias").value || 1;

let renda = document.getElementById("renda").value || "";
let desemp = +document.getElementById("desempregados").value || 0;

let destino = document.getElementById("destino").value;

let dataIni = document.getElementById("dataIni").value;
let dataFim = document.getElementById("dataFim").value;

/* consumo base */
let consumo = lf - li;
if(consumo <= 0) consumo = moradores * 5;

/* ajuste por economias */
let consumoFinal = consumo / economias;

/* valores */
let agua = tarifa(consumoFinal);
let esgoto = (destino === "rede") ? agua : 0;

/* ALERTAS */
let alertas = [];

/* consumo */
if(consumoFinal > 250) alertas.push("🔴 Vazamento provável");
else if(consumoFinal > 150) alertas.push("🟡 Consumo elevado");
else alertas.push("🟢 Normal");

/* social */
let rendaNum = renda.replace(/\D/g,"");
if((rendaNum && rendaNum < 200000) || desemp > 0){
alertas.push("💙 Tarifa social possível");
}

/* esgoto */
if(destino !== "rede"){
alertas.push("🚫 Esgoto não coletado pela rede");
}

/* LEQUE VISUAL */
document.getElementById("resultado").innerHTML = `
<div class="resultado">

<b>📊 LAUDO ÁGUA JUSTA</b><br><br>

<div class="box">📅 Período: ${dataIni || "-"} até ${dataFim || "-"}</div>

<div class="box">💧 Consumo bruto: ${consumo} m³</div>

<div class="box">🏠 Economias: ${economias}</div>

<div class="box">📊 Consumo ajustado: ${consumoFinal.toFixed(2)} m³</div>

<div class="box">💰 Água: R$ ${agua.toFixed(2)}</div>

<div class="box">🚽 Esgoto: R$ ${esgoto.toFixed(2)}</div>

<div class="box"><b>💵 Total: R$ ${(agua+esgoto).toFixed(2)}</b></div>

<div class="box">
<b>⚠️ ALERTAS</b><br>
${alertas.map(a=>"• "+a).join("<br>")}
</div>

</div>
`;
}

</script>

</body>
</html>
