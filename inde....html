<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Água Justa ⚖️💧</title>

<style>
body { font-family: Arial; background:#eef6fb; padding:20px; }
.container { max-width:1100px; margin:auto; background:white; padding:20px; border-radius:10px; }

h2 { margin-bottom:5px; }
h3 { margin-top:25px; border-bottom:2px solid #ccc; padding-bottom:5px; }

.grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
.campo { display:flex; flex-direction:column; }

input, select { padding:8px; }

button {
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#0077cc;
  color:white;
  border:none;
  cursor:pointer;
}

.resultado { margin-top:20px; padding:15px; border-radius:5px; display:none; }

.verde { background:#d4edda; }
.amarelo { background:#fff3cd; }
.vermelho { background:#f8d7da; font-weight:bold; animation: piscar 1s infinite; }

@keyframes piscar {
  0%,100% {opacity:1;}
  50% {opacity:0.3;}
}

.bloqueado {
  margin-top:15px;
  padding:10px;
  background:#eee;
  text-align:center;
  font-weight:bold;
}
</style>

<!-- QR CODE -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

</head>

<body>

<div class="container">

<h2>💧 Água Justa ⚖️💧</h2>

<h3>📄 Dados do Cliente</h3>
<div class="grid">
<div class="campo"><label>Nome</label><input id="nome"></div>
<div class="campo"><label>CPF / CNPJ</label><input id="doc"></div>
<div class="campo"><label>RGI / PDE</label><input id="rgi"></div>
<div class="campo"><label>Logradouro</label><input id="logradouro"></div>
<div class="campo"><label>Número</label><input id="numero"></div>
</div>

<h3>🏠 Dados do Imóvel</h3>
<div class="grid">

<div class="campo">
<label>Região</label>
<select id="regiao">
<option value="metropolitana">Metropolitana</option>
<option value="regional">Regional</option>
</select>
</div>

<div class="campo">
<label>Tipo de ligação</label>
<select id="ligacao">
<option value="agua">Água</option>
<option value="agua_esgoto">Água + Esgoto</option>
<option value="esgoto">Somente Esgoto</option>
</select>
</div>

<div class="campo">
<label>Categoria</label>
<select id="categoria">
<option value="residencial_normal">Residencial Normal</option>
<option value="residencial_social">Residencial Social</option>
</select>
</div>

<div class="campo">
<label>Nº economias</label>
<select id="economias">
<option>1</option><option>2</option><option>3</option><option>4</option>
</select>
</div>

</div>

<h3>👥 Perfil Social</h3>
<div class="grid">

<div class="campo">
<label>Moradores</label>
<select id="moradores">
<option>1</option><option>2</option><option>3</option><option>4</option>
<option>5</option><option>6</option><option>7</option><option>8</option>
</select>
</div>

<div class="campo">
<label>Renda Familiar (R$)</label>
<input id="renda" type="number">
</div>

<div class="campo">
<label>Desempregados</label>
<select id="desempregados">
<option>0</option><option>1</option><option>2</option><option>3</option>
</select>
</div>

<div class="campo">
<label>Deficiência</label>
<select id="vulneraveis">
<option>0</option><option>1</option><option>2</option>
</select>
</div>

</div>

<h3>💧 Consumo</h3>
<div class="grid">

<div class="campo"><label>Leitura inicial</label><input id="li" type="number"></div>
<div class="campo"><label>Leitura final</label><input id="lf" type="number"></div>

<div class="campo"><label>Data inicial</label><input id="d1" type="date"></div>
<div class="campo"><label>Data final</label><input id="d2" type="date"></div>

<div class="campo">
<label>Destino do esgoto</label>
<select id="destinoEsgoto">
<option value="rede_frente">Rede - Frente</option>
<option value="fossa">Fossa</option>
<option value="ceu">A céu aberto</option>
</select>
</div>

</div>

<button onclick="calcular()">Calcular</button>

<div id="resultado" class="resultado"></div>

<!-- PAGAMENTO -->
<div id="pagamento" style="display:none; margin-top:20px;">
  <h3>💳 Pagamento</h3>
  <canvas id="qrcode"></canvas>
  <p id="statusPagamento">Aguardando pagamento...</p>
</div>

</div>

<script>

// 🔗 SUA API (Render)
const API = "https://agua-apenas-backend.onrender.com";
let paymentId = null;

// ===== TARIFA =====
function calcularTarifa(consumo){
  return consumo * 5;
}

function calcular(){

let moradores=+document.getElementById("moradores").value||1;
let renda=+document.getElementById("renda").value||0;
let li=+document.getElementById("li").value||0;
let lf=+document.getElementById("lf").value||0;

let consumo=lf-li;
if(consumo<=0){
  alert("Leitura inválida");
  return;
}

let consumoDia=(consumo/moradores/30)*1000;

let status="🟢 Normal", cor="verde";
if(consumoDia>150){ status="🟡 Acima da média"; cor="amarelo"; }
if(consumoDia>250){ status="🔴 Possível vazamento"; cor="vermelho"; }

let valor = calcularTarifa(consumo);

let div=document.getElementById("resultado");
div.style.display="block";
div.className="resultado "+cor;

div.innerHTML = `
<b>Consumo:</b> ${consumo} m³<br>
<b>Status:</b> ${status}<br><br>

<b>Valor estimado:</b> R$ ${valor.toFixed(2)}<br><br>

<div class="bloqueado">
<button onclick="gerarPix()">
🔒 Liberar relatório completo (R$ 4,99)
</button>
</div>
`;
}

// ===== PIX =====
async function gerarPix() {

  document.getElementById("pagamento").style.display = "block";

  try {

    const res = await fetch(`${API}/criar-pix`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ valor: 4.99 })
    });

    const data = await res.json();

    if (!data.qr_code) {
      alert("Erro ao gerar PIX");
      return;
    }

    paymentId = data.id;

    QRCode.toCanvas(
      document.getElementById("qrcode"),
      data.qr_code
    );

    verificarPagamento();

  } catch {
    alert("Erro ao conectar com servidor");
  }
}

function verificarPagamento() {

  const interval = setInterval(async () => {

    try {

      const res = await fetch(`${API}/status/${paymentId}`);
      const data = await res.json();

      if (data.liberado) {
        clearInterval(interval);

        document.getElementById("statusPagamento").innerText =
          "✅ Pagamento aprovado!";

        alert("📄 Relatório liberado!");
      }

    } catch {}

  }, 5000);
}

</script>

</body>
</html>
